<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABGRADE AI</title>

    <link rel="stylesheet" href="/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background-glow"></div>

    <div class="chat-container">

        <div class="logo-section">
            <h1>ABGRADE</h1>
            <p>Evolving Intelligence</p>
        </div>

        <div id="chat-box" class="chat-box"></div>

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Message Abgrade..."
            >

            <button onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

    <script src="/script.js"></script>

</body>
</html>
